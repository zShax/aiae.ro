<svg
  xmlns="http://www.w3.org/2000/svg"
  width="800"
  height="800"
  viewBox="0 0 800 800"
  fill="none"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <defs>
    <clipPath id="tile"><rect x="0" y="0" width="800" height="800" /></clipPath>

    <!-- ===== MONOLINE GRAFFITI GLYPHS (10 x 14 unit box) ===== -->
    <g id="g-A">
      <path d="M0.4,14 L5,0 L9.6,13.8" />
      <path d="M2.3,9.6 L7.8,9.4" />
    </g>
    <g id="g-I">
      <path d="M1.4,0.4 L8.6,0" />
      <path d="M5,0.2 L4.8,13.8" />
      <path d="M1.4,14 L8.6,13.5" />
    </g>
    <g id="g-E">
      <path d="M9.3,0.4 L1,0 L1.3,13.8 L9.1,14" />
      <path d="M1.1,7 L7.1,6.7" />
    </g>
    <g id="g-R">
      <path d="M1,14 L1.1,0.3 L7,0 L9.3,2.6 L9.1,5.4 L6.8,7.6 L1.2,7.4" />
      <path d="M5.2,7.5 L9.5,14" />
    </g>
    <g id="g-O"><path d="M5,0 L1,3 L1.2,11 L5,14 L9,11 L8.8,3 Z" /></g>
    <g id="g-DOT"><path d="M2,11.7 L4.3,11.9 L4.2,14 L1.9,13.9 Z" /></g>
    <g id="g-SEMI">
      <path d="M2.9,7 L3.1,7" />
      <path d="M3.7,11.5 L1.8,15.6" />
    </g>
    <g id="g-SL">
      <path d="M2,14 L7.6,0" />
      <path d="M7,14 L12.6,0" />
    </g>

    <!-- ===== WORD LOCKUPS ===== -->
    <g id="w-aiae">
      <use href="#g-A" x="0" />
      <use href="#g-I" x="12" />
      <use href="#g-A" x="24" />
      <use href="#g-E" x="36" />
    </g>
    <g id="w-aiaero">
      <use href="#g-A" x="0" />
      <use href="#g-I" x="12" />
      <use href="#g-A" x="24" />
      <use href="#g-E" x="36" />
      <use href="#g-DOT" x="48" />
      <use href="#g-R" x="55" />
      <use href="#g-O" x="67" />
    </g>
    <g id="w-aia-e">
      <use href="#g-A" x="0" />
      <use href="#g-I" x="12" />
      <use href="#g-A" x="24" />
      <use href="#g-E" x="44" />
    </g>
    <g id="w-aia-e-dot">
      <use href="#w-aia-e" />
      <use href="#g-DOT" x="56" />
    </g>
    <g id="w-aia-e-semi">
      <use href="#w-aia-e" />
      <use href="#g-SEMI" x="56" />
    </g>
    <g id="w-ae">
      <use href="#g-A" x="0" />
      <use href="#g-E" x="12" />
    </g>
    <g id="w-aiae-slash">
      <use href="#w-aiae" />
      <use href="#g-SL" x="50" />
    </g>

    <!-- ===== ONE REPEAT UNIT OF INK ===== -->
    <g id="ink" stroke-width="2.6">
      <!-- ink layer -->
      <g stroke="#6e6a60">
        <g transform="translate(28,74) rotate(-6) scale(2.6)"><use href="#w-aiaero" /></g>
        <g transform="translate(296,196) rotate(-10) scale(3.1)"><use href="#w-aiae" /></g>
        <g transform="translate(-34,372) rotate(3) scale(2.2)"><use href="#w-aiae-slash" /></g>
        <g transform="translate(556,414) rotate(-12) scale(2.4)"><use href="#w-aia-e" /></g>
        <g transform="translate(74,556) rotate(-2) scale(2.8)"><use href="#w-aiaero" /></g>
        <g transform="translate(430,598) rotate(6) scale(2.0)"><use href="#w-aia-e-dot" /></g>
        <g transform="translate(118,742) rotate(4) scale(1.9)"><use href="#w-aia-e-semi" /></g>
        <g transform="translate(640,86) rotate(-3) scale(1.7)"><use href="#w-ae" /></g>
        <g transform="translate(376,762) rotate(-3) scale(1.5)"><use href="#w-aiaero" /></g>
        <g transform="translate(716,690) rotate(9) scale(1.4)"><use href="#w-aiae" /></g>
        <g transform="translate(180,300) rotate(7) scale(1.3)"><use href="#w-ae" /></g>
        <g transform="translate(486,318) rotate(2) scale(1.2)"><use href="#w-aia-e-semi" /></g>
      </g>

      <!-- warning red layer -->
      <g stroke="#D94F1E">
        <g transform="translate(432,54) rotate(4) scale(2.0)"><use href="#w-aia-e-dot" /></g>
        <g transform="translate(58,228) rotate(2) scale(1.6)"><use href="#w-aia-e-semi" /></g>
        <g transform="translate(618,236) rotate(8) scale(1.9)"><use href="#w-ae" /></g>
        <g transform="translate(248,398) rotate(-4) scale(1.5)"><use href="#w-aiaero" /></g>
        <g transform="translate(686,520) rotate(-6) scale(1.7)"><use href="#w-aiae" /></g>
        <g transform="translate(316,506) rotate(11) scale(1.25)"><use href="#w-aiae" /></g>
        <g transform="translate(-10,660) rotate(-8) scale(1.5)"><use href="#w-ae" /></g>
        <g transform="translate(540,742) rotate(3) scale(1.3)"><use href="#w-aia-e" /></g>
        <g transform="translate(214,132) rotate(-14) scale(1.15)"><use href="#w-ae" /></g>
        <g transform="translate(768,340) rotate(5) scale(1.4)"><use href="#w-aia-e" /></g>
      </g>

      <!-- micro registration ticks -->
      <g stroke="#D94F1E" stroke-width="5">
        <path d="M154,466 L166,466" />
        <path d="M598,150 L610,150" />
        <path d="M392,684 L404,684" />
        <path d="M76,352 L88,352" />
        <path d="M676,596 L688,596" />
        <path d="M268,58 L280,58" />
      </g>
      <g stroke="#6e6a60" stroke-width="4">
        <path d="M520,264 L520,276" />
        <path d="M132,626 L132,638" />
        <path d="M744,432 L744,444" />
        <path d="M348,336 L348,348" />
      </g>
    </g>
  </defs>

  <!-- ===== TILE ===== -->
  <g clip-path="url(#tile)">
    <use href="#ink" x="-800" y="-800" />
    <use href="#ink" x="0" y="-800" />
    <use href="#ink" x="800" y="-800" />
    <use href="#ink" x="-800" y="0" />
    <use href="#ink" x="0" y="0" />
    <use href="#ink" x="800" y="0" />
    <use href="#ink" x="-800" y="800" />
    <use href="#ink" x="0" y="800" />
    <use href="#ink" x="800" y="800" />
  </g>
</svg>
